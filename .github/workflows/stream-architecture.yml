name: Stream architecture guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stream-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Verify UI/stream separation
        run: >-
          python -m pytest -q
          tests/test_stream_state_monitor.py
          tests/test_stream_architecture_contract.py
