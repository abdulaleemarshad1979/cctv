services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: pushkaralu-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ./data/outputs:/app/outputs
      - ./data/logs:/app/logs
      - ./dm_count/pretrained_models:/app/dm_count/pretrained_models:ro
    networks:
      - pushkaralu
    depends_on:
      - mediamtx

  mediamtx:
    build:
      context: .
      dockerfile: deployment/Dockerfile.mediamtx
    image: pushkaralu-mediamtx-curl:1.19.3
    container_name: pushkaralu-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC Signalling
      - "8189:8189/udp" # WebRTC Media
    volumes:
      - ./deployment/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - pushkaralu

  nginx:
    image: nginx:alpine
    container_name: pushkaralu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/certificates:/etc/nginx/certificates:ro
    depends_on:
      - app
    networks:
      - pushkaralu

networks:
  pushkaralu:
    driver: bridge
