logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

# Default internal auth only allows the 'api' action from 127.0.0.1/::1.
# The app container calls this API from a different IP on the internal
# docker network (port 9997 is not published to the host or internet),
# so we explicitly allow publish/read/playback/api for any caller here.
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api


# Drone 4G uplinks can stall for 10-20 s and then resume. Keep the publisher
# session (and its recording file) open through such stalls instead of
# dropping it at the 10 s default. Keep MEDIAMTX_READ_TIMEOUT_SECONDS in .env
# equal to this value.
readTimeout: 20s

rtsp: yes
rtspAddress: :8554

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentCount: 12
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts:
  - 127.0.0.1
  - localhost
  - 192.168.1.7
  - 117.216.215.157
  - stream.dmsegpolice.in

pathDefaults:
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordMaxPartSize: 50M
  recordSegmentDuration: 50m
  recordDeleteAfter: 0s

paths:

  # REAL DRONE SOURCE STREAMS ONLY.
  #
  # MediaMTX records the encoded stream directly. There is NO decoding and
  # NO re-encoding, therefore the archive retains the exact video quality
  # received from the drone publisher.
  "~^live/drone[0-9]+$":
    record: true
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4

    # Fragment frequently for crash resilience without changing video quality.
    recordPartDuration: 1s
    recordMaxPartSize: 100M

    # A normal drone flight will generally remain a single file. The file is
    # closed immediately when the publisher disconnects.
    recordSegmentDuration: 50m

    # Do not auto-delete police archives.
    recordDeleteAfter: 0s

    runOnAvailable: 'curl --fail --silent --show-error --max-time 3 -X POST http://app:8000/cameras/state -H "Content-Type: application/json" -d "{\"path\":\"$MTX_PATH\", \"status\":\"online\"}"'
    runOnUnavailable: 'curl --fail --silent --show-error --max-time 3 -X POST http://app:8000/cameras/state -H "Content-Type: application/json" -d "{\"path\":\"$MTX_PATH\", \"status\":\"offline\"}"'

  # Other MediaMTX paths still report state but are NOT recorded, preventing
  # duplicate recordings of the AI/analyzed stream.
  all_others:
    record: false
    runOnAvailable: 'curl --fail --silent --show-error --max-time 3 -X POST http://app:8000/cameras/state -H "Content-Type: application/json" -d "{\"path\":\"$MTX_PATH\", \"status\":\"online\"}"'
    runOnUnavailable: 'curl --fail --silent --show-error --max-time 3 -X POST http://app:8000/cameras/state -H "Content-Type: application/json" -d "{\"path\":\"$MTX_PATH\", \"status\":\"offline\"}"'
