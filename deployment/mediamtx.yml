logLevel: info
logDestinations: [stdout]

rtsp: yes
rtspAddress: :8554

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts:
  - 192.168.1.7
  - 117.216.215.157
  - stream.dmsegpolice.in
# ponytail: simple production MediaMTX configuration for RTSP, RTMP, HLS, and WebRTC

paths:
  all:
    runOnReady: 'curl -X POST http://app:8000/cameras/state -H "Content-Type: application/json" -d "{\"path\":\"$MTX_PATH\", \"status\":\"online\"}"'
    runOnNotReady: 'curl -X POST http://app:8000/cameras/state -H "Content-Type: application/json" -d "{\"path\":\"$MTX_PATH\", \"status\":\"offline\"}"'



