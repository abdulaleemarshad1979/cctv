# Nginx Configuration for EGDMS (East Godavari District Monitoring System)
# Supports Cloudflare Full (Strict) SSL with Origin CA Certificate and WebRTC/HLS Proxy

server {
    listen 80;
    server_name dmsegpolice.in stream.dmsegpolice.in _;

    client_max_body_size 100M;

    # MediaMTX HLS Stream Proxy
    location /hls/ {
        proxy_pass http://mediamtx:8888/;
        proxy_redirect http://mediamtx:8888/ /hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # MediaMTX WebRTC Signalling & HTTP proxy
    location /webrtc/ {
        proxy_pass http://mediamtx:8889/;
        proxy_redirect http://mediamtx:8889/ /webrtc/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Main Application API & Dashboard
    location / {
        proxy_pass http://app:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

server {
    listen 443 ssl;
    server_name dmsegpolice.in stream.dmsegpolice.in _;

    # Cloudflare Origin CA Certificates (placed in config/certificates/)
    ssl_certificate /etc/nginx/certificates/cert.pem;
    ssl_certificate_key /etc/nginx/certificates/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    # MediaMTX HLS Stream Proxy
    location /hls/ {
        proxy_pass http://mediamtx:8888/;
        proxy_redirect http://mediamtx:8888/ /hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # MediaMTX WebRTC Signalling & HTTP proxy
    location /webrtc/ {
        proxy_pass http://mediamtx:8889/;
        proxy_redirect http://mediamtx:8889/ /webrtc/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Main Application API & Dashboard
    location / {
        proxy_pass http://app:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}


